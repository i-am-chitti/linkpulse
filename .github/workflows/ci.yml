name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Real value only matters for the `verify` job's Postgres service; `prisma
  # generate` (build/typecheck) never opens a connection, it just requires
  # the variable to exist - same reasoning as the Docker build's placeholder.
  DATABASE_URL: postgresql://linkpulse:linkpulse@localhost:5433/linkpulse

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  verify:
    runs-on: ubuntu-latest
    services:
      # Ports match .env.example / docker-compose.yml's defaults, which the
      # api package's vitest.config.ts hardcodes into its test env - so the
      # test suite finds Postgres/Redis without any per-CI config of its own.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkpulse
          POSTGRES_PASSWORD: linkpulse
          POSTGRES_DB: linkpulse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U linkpulse -d linkpulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same order as local verification: shared must be built before
      # anything that imports @linkpulse/shared can typecheck or test against it.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm --filter @linkpulse/api run test:db:setup
      - run: pnpm test

  docker:
    needs: [lint, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: packages/api/Dockerfile
          - image: web
            dockerfile: packages/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/linkpulse-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/linkpulse-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
