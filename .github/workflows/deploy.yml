name: Deploy

# Manual only - this targets one real, costed instance, so a redeploy is a
# deliberate action, not a side effect of merging.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_API_URL is inlined at Next.js build time (packages/web/lib/env.ts) -
      # built and pushed here, separately from ci.yml's :latest, with the
      # same-origin (empty) value baked in.
      - name: Build and push linkpulse-web:prod
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/linkpulse-web:prod
          build-args: NEXT_PUBLIC_API_URL=

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Runs from the runner, straight against Neon - the host never needs
      # Prisma or the schema.
      - name: Run database migrations
        run: pnpm --filter @linkpulse/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}

      # Assembled here, never committed or logged - GitHub also masks any
      # secret value that happens to appear in output.
      - name: Write .env.production
        run: |
          cat > /tmp/.env.production <<'EOF'
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          DOMAIN=${{ vars.DOMAIN }}
          APP_BASE_URL=${{ vars.APP_BASE_URL }}
          CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
          WEB_ORIGIN=${{ vars.WEB_ORIGIN }}
          GITHUB_CLIENT_ID=${{ vars.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          EOF

      - name: Copy compose files and start
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key"
          $SSH "$DEPLOY_HOST" 'mkdir -p ~/linkpulse'
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml Caddyfile "$DEPLOY_HOST:~/linkpulse/"
          scp -i ~/.ssh/deploy_key /tmp/.env.production "$DEPLOY_HOST:~/linkpulse/.env.production"
          $SSH "$DEPLOY_HOST" 'cd ~/linkpulse && docker compose -f docker-compose.prod.yml --env-file .env.production pull && docker compose -f docker-compose.prod.yml --env-file .env.production up -d'

      - name: Smoke check
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key "$DEPLOY_HOST" 'curl -sf localhost/health'
