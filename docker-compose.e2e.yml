# Isolated stack for live/browser-driven checks (Playwright etc.): its own
# Postgres, Redis, and containers, entirely separate from docker-compose.yml's
# dev stack, on different host ports so both can run at once.
#
#   pnpm e2e:reset   # fresh containers, fresh database, migrations applied
#   pnpm e2e:clean   # truncate all data, keep the stack running
#   pnpm e2e:down    # stop everything and drop the volume
#   pnpm e2e:run     # reset, run a command against it, always tear down after
#
# Reachable at http://localhost:3001 (web) and http://localhost:4002 (api).

name: linkpulse-e2e

services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: linkpulse-e2e-postgres
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: linkpulse
      POSTGRES_DB: linkpulse
    ports:
      - '5434:5432'
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkpulse -d linkpulse']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-e2e:
    image: redis:7-alpine
    container_name: linkpulse-e2e-redis
    command: ['redis-server', '--maxmemory', '128mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '6382:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api-e2e:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runtime
    container_name: linkpulse-e2e-api
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://linkpulse:linkpulse@postgres-e2e:5432/linkpulse
      REDIS_URL: redis://redis-e2e:6379
      # Fixed dummy value, only valid inside this stack.
      JWT_SECRET: linkpulse-e2e-stack-dummy-secret-never-used-for-anything-real
      APP_BASE_URL: http://localhost:4002
      CORS_ORIGINS: http://localhost:3001
      WEB_ORIGIN: http://localhost:3001
    ports:
      - '4002:4000'
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker-e2e:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runtime
    container_name: linkpulse-e2e-worker
    command: ['node', 'packages/api/dist/worker.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://linkpulse:linkpulse@postgres-e2e:5432/linkpulse
      REDIS_URL: redis://redis-e2e:6379
      APP_BASE_URL: http://localhost:4002
      JWT_SECRET: linkpulse-e2e-stack-dummy-secret-never-used-for-anything-real
    depends_on:
      postgres-e2e:
        condition: service_healthy
      redis-e2e:
        condition: service_healthy

  web-e2e:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4002
    container_name: linkpulse-e2e-web
    ports:
      - '3001:3000'
    depends_on:
      api-e2e:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  e2e-postgres-data:
