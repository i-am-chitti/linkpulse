# Local development stack.
#
#   docker compose up -d                  # everything, including the API image
#   docker compose up -d postgres redis   # infra only, then `pnpm dev` on the host
#
# Host ports are configurable and default off the standard ports, so this stack
# coexists with other local services. Override in .env if these collide too:
#   API_PORT=4001  POSTGRES_PORT=5433  REDIS_PORT=6381

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: linkpulse
      POSTGRES_DB: linkpulse
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U linkpulse -d linkpulse']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linkpulse-redis
    restart: unless-stopped
    # Cache-sized memory bound with LRU eviction: under pressure Redis drops
    # cold keys instead of refusing writes, and reads fall through to Postgres.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - 'no'
    ports:
      - '${REDIS_PORT:-6381}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runtime
    container_name: linkpulse-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      # Service names resolve on the compose network; internal ports, not the
      # shifted host ports above.
      DATABASE_URL: postgresql://linkpulse:linkpulse@postgres:5432/linkpulse
      REDIS_URL: redis://redis:6379
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET in .env, generate one with openssl rand -hex 32}'
      APP_BASE_URL: http://localhost:${API_PORT:-4001}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      # Optional; unset leaves that provider's route 503ing. See .env.example.
      GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID:-}'
      GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET:-}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET:-}'
      TURNSTILE_SECRET_KEY: '${TURNSTILE_SECRET_KEY:-}'
    ports:
      - '${API_PORT:-4001}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    # Same image as the api, different entry point. It carries the ~110 MB geo
    # database, which is exactly why it is not the api process.
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runtime
    container_name: linkpulse-worker
    restart: unless-stopped
    command: ['node', 'packages/api/dist/worker.js']
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgresql://linkpulse:linkpulse@postgres:5432/linkpulse
      REDIS_URL: redis://redis:6379
      # Not used by the worker, but the shared config schema requires them.
      APP_BASE_URL: http://localhost:${API_PORT:-4001}
      JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET in .env, generate one with openssl rand -hex 32}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Inlined into the browser bundle at build time, so this has to be a
        # build arg rather than an `environment:` entry - the browser calls
        # the API from the host's own network, hence localhost and the host
        # port mapping, not the api service's container-internal address.
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4001}
        # Blank by default, matching the api's unset TURNSTILE_SECRET_KEY.
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: '${TURNSTILE_SITE_KEY:-}'
    container_name: linkpulse-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
